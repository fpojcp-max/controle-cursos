<div
  class="form-content sgc-calendario-view"
  id="calendarioConsultaRoot"
  data-placeholder-sala="Selecione"
>
  <div id="msgCal" class="sgc-msg-view-slot" aria-hidden="true"></div>
  <div class="actions-row">
    <div class="is-size-6 muted">
      Tela: <span class="pill"><?= parentItem ?> >> <?= subItem ?></span>
      <span class="is-size-7 ml-2" id="calTzHint"></span>
    </div>
  </div>

  <h2 class="section-title">Filtro</h2>
  <form id="calFormFiltro">
    <div class="columns is-multiline">
      <div class="column is-12">
        <label class="label" for="calSala">Sala <span class="sgc-obrigatorio" aria-hidden="true">*</span></label>
        <div class="select is-fullwidth">
          <select id="calSala" required></select>
        </div>
      </div>
    </div>
    <div class="consulta-form-actions">
      <button type="button" class="btn-custom btn-secondary" id="btnCalLimpar">Limpar</button>
      <button type="submit" class="btn-custom" id="btnCalAplicar">Pesquisar</button>
    </div>
  </form>

  <div id="calAreaWrap" class="sgc-cal-area-wrap" style="display: none;">
    <h2 class="section-title sgc-cal-sala-titulo" id="calSalaTitulo"></h2>
    <div id="sgcCalendarioEl" class="sgc-calendario-host" aria-label="Calendário de agendamentos da sala"></div>
    <div id="calLegenda" class="sgc-cal-legenda" aria-label="Legenda por curso"></div>
    <div id="calEventTooltip" class="sgc-cal-event-tooltip" hidden aria-hidden="true" role="tooltip">
      <div class="sgc-cal-tooltip-titulo" id="calTooltipTitulo"></div>
      <div class="sgc-cal-tooltip-linha" id="calTooltipHorario"></div>
    </div>
  </div>
</div>
