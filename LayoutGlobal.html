<style>
  :root {
    --brand: #00bfa5;
    --brand-faint: rgba(0, 191, 165, 0.08);
    --focus-ring: 0 0 0 0.125em rgba(0, 191, 165, 0.22);
    --ink: #1b3330;
    --muted: #6b8b86;
    --card: rgba(255, 255, 255, 0.98);
    --surface: #f8fcfb;
    --border: #dde5e3;
    --border-strong: #a8bab6;
    --shadow: 0 15px 35px rgba(0,0,0,0.10);
    --shadow-soft: 0 10px 24px rgba(0,0,0,0.08);
    --radius: 12px;
    --btn-radius: 12px;
    --menu-bar: #9ec9c0;
    --menu-bar-border: #7eb5aa;
    --menu-bar-active: #c8ebe4;
  }

  button {
    border-radius: var(--btn-radius);
  }

  body {
    background: linear-gradient(135deg, #e0f2f1 0%, #f1f8e9 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  body > .form-container { align-self: stretch; }

  /* Layout shell: 3 áreas físicas (header / main / footer); main cresce para rodapé ficar no pé da tela; conteúdo centralizado */
  .form-container {
    width: 100%;
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: transparent;
    flex: 1;
    min-height: 0;
    box-sizing: border-box;
  }

  .form-container > main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: visible;
  }

  .layout-block {
    background-color: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .header-banner {
    background-color: var(--surface);
    padding: 18px 26px;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .logo-group {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: nowrap;
  }

  .logo-home-link {
    display: inline-flex;
    align-items: center;
    cursor: pointer;
    text-decoration: none;
    border-radius: 4px;
    color: inherit;
  }
  .logo-home-link:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 3px;
  }

  .logo-img {
    max-height: 70px;
    width: auto;
  }

  .header-left-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .header-left-text small {
    font-weight: 600;
    color: #2d4a46;
  }

  .header-title {
    margin-left: auto;
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .header-title .title.is-4 {
    font-size: 1.75rem;
    color: #2d4a46;
    font-weight: 600;
    margin-bottom: 0;
  }

  .header-session {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    gap: 8px;
    min-width: 0;
  }

  .header-session-email {
    color: #2d4a46;
    font-size: 0.8rem;
    line-height: 1.2;
    max-width: 360px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.9;
  }
  .header-session-label {
    font-style: italic;
  }
  .header-session-sep {
    color: #6f8581;
    font-size: 0.8rem;
    line-height: 1;
    opacity: 0.9;
  }

  .header-session-logout {
    display: inline;
    padding: 0;
    background: transparent;
    color: #a85656;
    font-size: 0.8rem;
    font-weight: 500;
    font-style: italic;
    text-decoration: underline;
    cursor: pointer;
    opacity: 0.9;
  }
  .header-session-logout:hover {
    color: #8f4545;
    text-decoration: none;
    opacity: 1;
  }
  .header-session-logout:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  .footer-banner {
    background: var(--surface);
    padding: 14px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    border: 1px solid var(--border-strong);
  }

  /* Menu principal — faixa segmentada; tom mais marcado que o fundo da página (#e0f2f1) e do header (--surface) */
  .app-menu {
    background: var(--menu-bar);
    border: 1px solid var(--menu-bar-border);
    border-radius: var(--radius);
    margin: 0;
    overflow: visible;
    padding: 4px;
    box-sizing: border-box;
    box-shadow: inset 0 1px 2px rgba(27, 51, 48, 0.1);
  }
  .app-menu-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: inline-flex;
    flex-wrap: wrap;
    gap: 3px;
    align-items: center;
  }
  .app-menu-item {
    margin: 0;
    padding: 0;
    flex: 0 0 auto;
  }
  .app-menu-item-dropdown {
    position: relative;
  }
  .app-menu-trigger {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-width: 7.25rem;
    padding: 7px 10px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink);
    background: transparent;
    border: none;
    border-radius: calc(var(--radius) - 2px);
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    font-family: inherit;
    transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    box-sizing: border-box;
    box-shadow: none;
  }
  .app-menu-item:not(.app-menu-item-disabled) .app-menu-trigger:hover,
  .app-menu-item-dropdown.is-open > .app-menu-trigger,
  .app-menu-item-dropdown.is-active > .app-menu-trigger {
    color: var(--ink);
    font-weight: 700;
    background: var(--menu-bar-active);
    box-shadow: 0 1px 2px rgba(27, 51, 48, 0.14);
  }
  .app-menu-chevron {
    display: inline-block;
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    margin-left: 2px;
    transition: transform 0.2s;
  }
  .app-menu-item-dropdown.is-open .app-menu-chevron { transform: rotate(180deg); }
  .app-menu-sub {
    list-style: none;
    margin: 0;
    padding: 4px;
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;
    min-width: 168px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    z-index: 50;
    box-sizing: border-box;
  }
  .app-menu-item-dropdown.is-open .app-menu-sub { display: block; }
  .app-menu-sub li { margin: 0 0 4px 0; }
  .app-menu-sub li:last-child { margin-bottom: 0; }
  .app-menu-link {
    display: block;
    padding: 6px 10px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #000;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s, font-weight 0.15s ease;
    border: 1px solid var(--border);
    border-radius: var(--btn-radius);
    background: #f8fcfb;
    cursor: pointer;
    box-sizing: border-box;
  }
  .app-menu-link:hover {
    border-color: var(--brand);
    color: var(--brand);
  }
  .app-menu-link.is-active {
    color: #000;
    font-weight: 800;
    border-color: var(--brand);
    border-width: 2px;
    padding: 5px 9px;
    background: #f8fcfb;
    box-shadow: none;
  }
  .app-menu-item-disabled .app-menu-trigger {
    color: var(--muted);
    cursor: not-allowed;
    opacity: 0.7;
  }
  .app-menu-item-disabled .app-menu-chevron { display: none; }

  /* Responsividade: título quebra e alinha bem */
  @media (max-width: 820px) {
    .header-inner { flex-wrap: wrap; }
    .header-title { margin-left: 0; width: 100%; text-align: left; align-items: flex-start; }
    .header-session { width: 100%; justify-content: flex-start; align-items: center; min-width: 0; }
    .logo-img { max-height: 58px; }
  }
</style>
