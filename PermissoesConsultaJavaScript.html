<script>
(function() {
  var PAGE_SIZE = 50;
  var MSG_SEM_RESULTADO = "Nenhum resultado encontrado para os filtros selecionados.";
  var MSG_MODAL_EXCLUSAO = "Confirma a exclusão da permissão?\nA operação não poderá ser revertida.";
  var currentSort = { key: "nome", dir: "asc" };
  var lastQuery = null;
  var currentPage = 1;
  var totalRecords = 0;
  var colunasAtuais = [];
  var sheetRowsPagina = [];
  var linhaSelecionadaIndex = -1;
  var trSelecionado = null;
  var permExclusaoEmProgresso = false;

  function renderMsg(text, type) {
    if (typeof window.sgcRenderMensagemTopo === "function") {
      window.sgcRenderMensagemTopo(text, type);
    }
  }

  function fillSelect(id, items) {
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = "";
    el.appendChild(new Option("Todos", ""));
    (items || []).forEach(function(item) { el.appendChild(new Option(item, item)); });
  }

  function getFilters() {
    return {
      nome: document.getElementById("permConsultaFiltroNome").value || "",
      email: document.getElementById("permConsultaFiltroEmail").value || "",
      perfil: document.getElementById("permConsultaFiltroPerfil").value || ""
    };
  }

  function limparSelecao() {
    if (trSelecionado) trSelecionado.classList.remove("consulta-tr-selecionada");
    trSelecionado = null;
    linhaSelecionadaIndex = -1;
    var btnE = document.getElementById("btnPermConsultaExcluir");
    if (btnE) btnE.disabled = true;
  }

  function setResultadosVisivel(v) {
    var el = document.getElementById("permConsultaResultadosBlock");
    if (el) el.style.display = v ? "" : "none";
  }

  function renderTabela(columns, rows) {
    var head = document.getElementById("permConsultaResultsHead");
    var body = document.getElementById("permConsultaResultsBody");
    if (!head || !body) return;
    head.innerHTML = "";
    var trh = document.createElement("tr");
    (columns || []).forEach(function(col) {
      var th = document.createElement("th");
      th.textContent = col.label || col.key || "";
      trh.appendChild(th);
    });
    head.appendChild(trh);
    body.innerHTML = "";
    (rows || []).forEach(function(row, ix) {
      var tr = document.createElement("tr");
      tr.style.cursor = "pointer";
      (row || []).forEach(function(cell) {
        var td = document.createElement("td");
        td.textContent = cell == null ? "" : String(cell);
        tr.appendChild(td);
      });
      tr.addEventListener("click", function() {
        if (linhaSelecionadaIndex === ix) { limparSelecao(); return; }
        limparSelecao();
        trSelecionado = tr;
        linhaSelecionadaIndex = ix;
        tr.classList.add("consulta-tr-selecionada");
        var btnE = document.getElementById("btnPermConsultaExcluir");
        if (btnE) btnE.disabled = false;
      });
      body.appendChild(tr);
    });
  }

  function atualizarPaginacao() {
    var bar = document.getElementById("permConsultaPaginationBar");
    var meta = document.getElementById("permConsultaResultsMeta");
    var label = document.getElementById("permConsultaPaginationLabel");
    if (!bar) return;
    if (totalRecords <= PAGE_SIZE) {
      bar.style.display = "none";
      if (meta) meta.textContent = totalRecords ? "Total: " + totalRecords : "";
      return;
    }
    bar.style.display = "";
    var totalPages = Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));
    if (meta) meta.textContent = "Total: " + totalRecords;
    if (label) label.textContent = "Página " + currentPage + " de " + totalPages;
    var btnA = document.getElementById("btnPermConsultaPagAnterior");
    var btnP = document.getElementById("btnPermConsultaPagProxima");
    if (btnA) btnA.disabled = currentPage <= 1;
    if (btnP) btnP.disabled = currentPage >= totalPages;
  }

  function pesquisar(manterMsg) {
    if (!manterMsg) renderMsg("");
    limparSelecao();
    lastQuery = getFilters();
    currentPage = 1;
    executarPesquisa();
  }

  function setSearching(isSearching) {
    if (typeof window.sgcDefinirPesquisaOcupada === "function") {
      window.sgcDefinirPesquisaOcupada("btnPermConsultaPesquisar", isSearching);
    }
  }

  function executarPesquisa() {
    var offset = (currentPage - 1) * PAGE_SIZE;
    setSearching(true);
    google.script.run
      .withSuccessHandler(function(resp) {
        try {
          if (resp && resp.erro) {
            renderMsg(resp.erro, "danger");
            setResultadosVisivel(false);
            return;
          }
          colunasAtuais = resp.columns || [];
          totalRecords = resp.total || 0;
          sheetRowsPagina = resp.sheetRows || [];
          if (!totalRecords) {
            renderMsg(MSG_SEM_RESULTADO, "info");
            setResultadosVisivel(false);
            return;
          }
          setResultadosVisivel(true);
          renderTabela(colunasAtuais, resp.rows || []);
          atualizarPaginacao();
          var btnCsv = document.getElementById("btnPermConsultaExportarCsv");
          if (btnCsv) btnCsv.disabled = false;
        } finally {
          setSearching(false);
        }
      })
      .withFailureHandler(function(err) {
        setSearching(false);
        renderMsg("Erro: " + (err && err.message ? err.message : String(err)), "danger");
      })
      .pesquisarPermissoesConsulta(lastQuery, currentSort, { offset: offset, limit: PAGE_SIZE });
  }

  function fecharModalExclusaoPerm_() {
    if (typeof window.sgcModalFechar === "function") {
      window.sgcModalFechar("permConsultaExclusaoModal");
    }
  }

  function abrirModalExclusaoPerm_() {
    var msg = document.getElementById("permConsultaExclusaoModalMsg");
    if (msg) msg.textContent = MSG_MODAL_EXCLUSAO;
    if (typeof window.sgcModalAbrir === "function") {
      window.sgcModalAbrir("permConsultaExclusaoModal", { btnPrimario: "btnPermConsultaExclusaoConfirmar" });
    }
  }

  function confirmarExclusaoPerm_() {
    if (linhaSelecionadaIndex < 0 || !sheetRowsPagina[linhaSelecionadaIndex]) return;
    var sr = sheetRowsPagina[linhaSelecionadaIndex];
    permExclusaoEmProgresso = true;
    var btnConf = document.getElementById("btnPermConsultaExclusaoConfirmar");
    var btnVolt = document.getElementById("btnPermConsultaExclusaoVoltar");
    var btnX = document.getElementById("permConsultaExclusaoModalFecharX");
    if (typeof window.sgcDefinirBotaoOcupado === "function") {
      window.sgcDefinirBotaoOcupado(btnConf, true);
    }
    if (btnVolt) btnVolt.disabled = true;
    if (btnX) btnX.disabled = true;
    google.script.run
      .withSuccessHandler(function(resp) {
        permExclusaoEmProgresso = false;
        if (typeof window.sgcDefinirBotaoOcupado === "function") {
          window.sgcDefinirBotaoOcupado(btnConf, false);
        }
        if (btnVolt) btnVolt.disabled = false;
        if (btnX) btnX.disabled = false;
        fecharModalExclusaoPerm_();
        if (!resp || !resp.success) {
          renderMsg((resp && resp.message) || "Não foi possível excluir.", "danger");
          return;
        }
        renderMsg(resp.message || "Permissão excluída.", "success");
        executarPesquisa();
      })
      .withFailureHandler(function(err) {
        permExclusaoEmProgresso = false;
        if (typeof window.sgcDefinirBotaoOcupado === "function") {
          window.sgcDefinirBotaoOcupado(btnConf, false);
        }
        if (btnVolt) btnVolt.disabled = false;
        if (btnX) btnX.disabled = false;
        fecharModalExclusaoPerm_();
        renderMsg("Erro: " + (err && err.message ? err.message : String(err)), "danger");
      })
      .excluirPermissaoConsulta(sr);
  }

  function wireModalExclusaoPerm_() {
    if (typeof window.sgcModalConfigurar !== "function") return;
    window.sgcModalConfigurar("permConsultaExclusaoModal", {
      btnVoltar: "btnPermConsultaExclusaoVoltar",
      btnFecharX: "permConsultaExclusaoModalFecharX",
      btnConfirmar: "btnPermConsultaExclusaoConfirmar",
      onConfirmar: confirmarExclusaoPerm_,
      podeFechar: function() { return !permExclusaoEmProgresso; }
    });
  }

  function resetarUiAoEntrar_(recarregarOpcoes) {
    fecharModalExclusaoPerm_();
    var form = document.getElementById("permConsultaSearchForm");
    if (form) form.reset();
    setResultadosVisivel(false);
    limparSelecao();
    renderMsg("");
    currentPage = 1;
    totalRecords = 0;
    lastQuery = null;
    currentSort = { key: "nome", dir: "asc" };
    colunasAtuais = [];
    sheetRowsPagina = [];
    var head = document.getElementById("permConsultaResultsHead");
    var body = document.getElementById("permConsultaResultsBody");
    if (head) head.innerHTML = "";
    if (body) body.innerHTML = "";
    var bar = document.getElementById("permConsultaPaginationBar");
    if (bar) bar.style.display = "none";
    var meta = document.getElementById("permConsultaResultsMeta");
    if (meta) meta.textContent = "";
    var btnCsv = document.getElementById("btnPermConsultaExportarCsv");
    if (btnCsv) btnCsv.disabled = true;
    if (recarregarOpcoes !== false) carregarFiltros();
  }

  window.SgcPermissoesConsultaResetarAoEntrar = function() {
    resetarUiAoEntrar_(true);
  };

  function carregarFiltros() {
    google.script.run
      .withSuccessHandler(function(config) {
        if (config && config.erro) {
          renderMsg(config.erro, "danger");
          return;
        }
        fillSelect("permConsultaFiltroPerfil", (config && config.perfis) || []);
      })
      .withFailureHandler(function(err) {
        renderMsg("Erro ao carregar filtros: " + (err && err.message ? err.message : String(err)), "danger");
      })
      .obterOpcoesFiltroPermissoesConsulta();
  }

  window.PermissoesConsultaInit = function() {
    var form = document.getElementById("permConsultaSearchForm");
    if (!form || form._permWired) {
      carregarFiltros();
      return;
    }
    form._permWired = true;
    form.addEventListener("submit", function(ev) {
      ev.preventDefault();
      pesquisar(false);
    });
    document.getElementById("btnPermConsultaLimpar").addEventListener("click", function() {
      resetarUiAoEntrar_(false);
    });
    document.getElementById("btnPermConsultaPagAnterior").addEventListener("click", function() {
      if (currentPage > 1) { currentPage--; executarPesquisa(); }
    });
    document.getElementById("btnPermConsultaPagProxima").addEventListener("click", function() {
      var totalPages = Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));
      if (currentPage < totalPages) { currentPage++; executarPesquisa(); }
    });
    document.getElementById("btnPermConsultaExcluir").addEventListener("click", function() {
      if (linhaSelecionadaIndex < 0 || !sheetRowsPagina[linhaSelecionadaIndex]) return;
      abrirModalExclusaoPerm_();
    });
    wireModalExclusaoPerm_();
    document.getElementById("btnPermConsultaExportarCsv").addEventListener("click", function() {
      if (!lastQuery) return;
      var btnCsv = document.getElementById("btnPermConsultaExportarCsv");
      if (typeof window.sgcDefinirBotaoOcupado === "function") {
        window.sgcDefinirBotaoOcupado(btnCsv, true);
      }
      google.script.run
        .withSuccessHandler(function(data) {
          if (typeof window.sgcDefinirBotaoOcupado === "function") {
            window.sgcDefinirBotaoOcupado(btnCsv, false, { habilitar: totalRecords > 0 && !!lastQuery });
          }
          if (data && data.erro) {
            renderMsg(data.erro, "danger");
            return;
          }
          var cols = data.columns || [];
          var rows = data.rows || [];
          var lines = [cols.map(function(c) { return '"' + String(c.label || "").replace(/"/g, '""') + '"'; }).join(";")];
          rows.forEach(function(row) {
            lines.push((row || []).map(function(c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(";"));
          });
          var blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "permissoes.csv";
          a.click();
        })
        .withFailureHandler(function(err) {
          if (typeof window.sgcDefinirBotaoOcupado === "function") {
            window.sgcDefinirBotaoOcupado(btnCsv, false, { habilitar: totalRecords > 0 && !!lastQuery });
          }
          renderMsg("Erro na exportação: " + (err && err.message ? err.message : String(err)), "danger");
        })
        .obterPermissoesConsultaParaExportar(lastQuery, currentSort);
    });
    carregarFiltros();
  };
})();
</script>
