    <script>
  function sgcEscapeHtmlMensagem_(str) {
    return String(str != null ? str : "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function sgcRolarParaMensagemTopo_() {
    setTimeout(function() {
      var topo = document.getElementById("sgcMensagemTopoApp");
      try {
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (e0) {
        try {
          window.scrollTo(0, 0);
        } catch (e1) {}
      }
      try {
        if (document.documentElement) document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      } catch (eDoc) {}
      if (topo && topo.innerHTML && topo.scrollIntoView) {
        try {
          topo.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (e2) {
          try {
            topo.scrollIntoView(true);
          } catch (e3) {}
        }
      }
    }, 0);
  }

  /**
   * Barra global de feedback (sucesso / erro / info) — acima do menu e do conteúdo.
   * @param {string} text
   * @param {string} [type] - danger | success | info | warning
   */
  window.sgcRenderMensagemTopo = function(text, type) {
    var el = document.getElementById("sgcMensagemTopoApp");
    if (!el) return;
    if (!text) {
      el.innerHTML = "";
      el.setAttribute("aria-hidden", "true");
      return;
    }
    el.setAttribute("aria-hidden", "false");
    var t = String(type || "info").toLowerCase();
    var cls =
      t === "danger" ? "is-danger" :
      t === "success" ? "is-success" :
      t === "warning" ? "is-warning" :
      "is-info";
    el.innerHTML =
      '<div class="notification ' + cls + ' is-light">' + sgcEscapeHtmlMensagem_(text) + "</div>";
    sgcRolarParaMensagemTopo_();
  };

  window.sgcRolarParaMensagemTopo = sgcRolarParaMensagemTopo_;

  /** Compatível com views que ainda chamam rolarParaVerMensagemNoTopo. */
  window.rolarParaVerMensagemNoTopo = function(optAnchor) {
    if (document.getElementById("sgcMensagemTopoApp") && document.getElementById("sgcMensagemTopoApp").innerHTML) {
      sgcRolarParaMensagemTopo_();
      return;
    }
    setTimeout(function() {
      var anchor = optAnchor;
      if (anchor && anchor.scrollIntoView) {
        try {
          anchor.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (e4) {
          try {
            anchor.scrollIntoView(true);
          } catch (e5) {}
        }
        return;
      }
      sgcRolarParaMensagemTopo_();
    }, 0);
  };

  /**
   * Erros de permissão Drive/Sheets (e similares) — mensagem única para o ecrã central.
   * @param {string} err
   * @returns {string|null} texto amigável ou null se não for caso conhecido
   */
  window.resolverMensagemErroInfraestruturaSpa = function(err) {
    var s = String(err || "");
    if (
      /Você não tem permissão para acessar o documento solicitado/i.test(s) ||
      /não tem permissão para aceder o documento/i.test(s) ||
      /não tem permissão para acessar o documento/i.test(s) ||
      /You do not have permission to access the requested document/i.test(s) ||
      /permission to access/i.test(s)
    ) {
      return (
        "Não tem permissão para aceder à planilha utilizada por esta aplicação. " +
        "Peça ao administrador que partilhe o ficheiro com o seu utilizador ou inicie sessão com a conta correta."
      );
    }
    if (/Não foi possível identificar o seu utilizador/i.test(s)) {
      return (
        "Não foi possível identificar o seu utilizador. " +
        "Aceda já autenticado com a conta do domínio (Web App como «quem acede»)."
      );
    }
    if (/não está cadastrado na aba Permissoes/i.test(s) || /Acesso negado\. O seu e-mail não está cadastrado/i.test(s)) {
      return s;
    }
    if (/Apenas administradores podem gerir permissões/i.test(s)) {
      return s;
    }
    return null;
  };
    </script>
    <script>
(function() {
  var MSG_BEMVINDO = "Seja bem-vindo ao Sistema de Gestão de Cursos e Turmas!";
  var mainContent = document.getElementById("main-content");
  if (!mainContent) return;

  function runScript(scriptText) {
    if (!scriptText || !scriptText.trim()) return;
    var code = scriptText.replace(/<script[^>]*>([\s\S]*?)<\/script>/gi, "$1").trim();
    if (!code) return;
    var el = document.createElement("script");
    el.textContent = code;
    document.body.appendChild(el);
    document.body.removeChild(el);
  }

  function closeMenuDropdowns() {
    var menu = document.querySelector(".app-menu");
    if (!menu) return;
    menu.querySelectorAll(".app-menu-item-dropdown.is-open").forEach(function(li) { li.classList.remove("is-open"); });
    menu.querySelectorAll(".app-menu-trigger[aria-expanded]").forEach(function(btn) { btn.setAttribute("aria-expanded", "false"); });
  }

  function setMenuActive(view, resourceId) {
    resourceId = resourceId && String(resourceId).trim() ? String(resourceId).trim() : "";
    var menu = document.querySelector(".app-menu");
    if (!menu) return;
    menu.querySelectorAll(".app-menu-item-dropdown").forEach(function(li) { li.classList.remove("is-active"); });
    menu.querySelectorAll(".app-menu-link").forEach(function(a) { a.classList.remove("is-active"); });
    menu.querySelectorAll(".app-menu-link-spa").forEach(function(a) { a.classList.remove("is-active"); });
    var group = null;
    if (view === "consulta" || view === "cadastro" || view === "turma-editar" || view === "turma-excluir") group = "turma";
    else if (
      view === "agendamento-incluir" ||
      view === "agendamento-consulta" ||
      view === "agendamento-editar" ||
      view === "agendamento-excluir"
    )
      group = "agendamento";
    else if (view === "calendario-consultar") group = "calendario";
    else if (view === "permissoes-incluir" || view === "permissoes-consultar")
      group = "permissoes";
    if (group) {
      var dd = menu.querySelector('.app-menu-item-dropdown[data-dropdown="' + group + '"]');
      if (dd) dd.classList.add("is-active");
    }
    var link = null;
    if (view === "cadastro" && resourceId) {
      link = menu.querySelector('.app-menu-link-spa[data-view="consulta"]');
    } else if (view === "cadastro") {
      link = menu.querySelector('.app-menu-link-spa[data-view="cadastro"]');
    } else {
      link = menu.querySelector('.app-menu-link[data-view="' + view + '"]');
      if (!link) link = menu.querySelector('.app-menu-link-spa[data-view="' + view + '"]');
    }
    if (link) link.classList.add("is-active");
  }

  function escHtmlSpa_(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function showBloqueioCentral(mensagemUsuario) {
    window.__spaAcessoPlanilhaOk = false;
    window.__spaAcessoPlanilhaMsg = mensagemUsuario;
    var corpo = escHtmlSpa_(mensagemUsuario);
    mainContent.innerHTML =
      '<div class="spa-bloqueio-sistema" role="alert">' +
      '<div class="spa-bloqueio-box">' +
      '<p class="spa-bloqueio-titulo">Indisponível</p>' +
      '<p class="spa-bloqueio-texto">' +
      corpo +
      "</p></div></div>";
    if (typeof window.rolarParaVerMensagemNoTopo === "function") {
      window.rolarParaVerMensagemNoTopo(mainContent);
    }
  }

  window.mostrarBloqueioCentralSpa = showBloqueioCentral;

  window.tratarErroInfraestruturaSpaSeAplicavel = function(err) {
    var friendly =
      typeof window.resolverMensagemErroInfraestruturaSpa === "function"
        ? window.resolverMensagemErroInfraestruturaSpa(String(err))
        : null;
    if (friendly) {
      showBloqueioCentral(friendly);
      return true;
    }
    return false;
  };

  function showError(msg) {
    var s = String(msg);
    if (typeof window.tratarErroInfraestruturaSpaSeAplicavel === "function" && window.tratarErroInfraestruturaSpaSeAplicavel(s)) {
      return;
    }
    mainContent.innerHTML =
      "<div class=\"main-placeholder\" style=\"display:flex;align-items:center;justify-content:center;color:#b71c1c;padding:24px;\">" +
      escHtmlSpa_(s) +
      "</div>";
    if (typeof window.rolarParaVerMensagemNoTopo === "function") {
      window.rolarParaVerMensagemNoTopo(mainContent);
    }
  }

  function mapearRespostaVerificacaoAcesso_(res) {
    if (res && res.ok) return null;
    var raw =
      res && res.message
        ? String(res.message)
        : "Não foi possível aceder à planilha.";
    if (typeof window.resolverMensagemErroInfraestruturaSpa === "function") {
      var friendly = window.resolverMensagemErroInfraestruturaSpa(raw);
      if (friendly) return friendly;
    }
    return raw;
  }

  function viewEhPermissoesAdmin_(view) {
    return view === "permissoes-incluir" || view === "permissoes-consultar";
  }

  function resolverViewPermitida_(view) {
    view = view || "home";
    if (viewEhPermissoesAdmin_(view) && window.__sgcPodeGerirPermissoes !== true) {
      return "home";
    }
    return view;
  }

  function definirTextoHome_(texto) {
    var p = document.getElementById("sgcHomeMensagemPrincipal");
    if (p) p.textContent = texto;
  }

  /** Home estática no cliente (como no Sistema de Apoio) — sem RPC. */
  function mostrarHomeLocal_(mensagem) {
    var msg = mensagem != null ? String(mensagem) : MSG_BEMVINDO;
    mainContent.innerHTML =
      '<div class="main-placeholder sgc-home-placeholder" role="region" aria-label="Tela inicial">' +
      '<p class="sgc-home-mensagem" id="sgcHomeMensagemPrincipal" role="status" aria-live="polite">' +
      escHtmlSpa_(msg) +
      "</p></div>";
  }

  function definirMenuVisivelArranque_(mostrar) {
    var menu = document.querySelector(".app-menu");
    if (!menu) return;
    menu.classList.toggle("sgc-menu-aguardando-gate", !mostrar);
    if (mostrar) {
      menu.removeAttribute("aria-hidden");
    } else {
      menu.setAttribute("aria-hidden", "true");
    }
  }

  function sgcMostrarAvisoSemAcesso_(mensagem) {
    var aviso = document.getElementById("sgcAvisoSemAcesso");
    if (!aviso) return;
    var p = aviso.querySelector("p");
    if (p) p.textContent = mensagem || "";
    aviso.classList.toggle("sgc-aviso-oculto", !mensagem);
  }

  window.sgcAplicarIdentidadeCabecalho = function(data) {
    var emailEl = document.getElementById("headerUserEmail");
    var logoutEl = document.getElementById("headerLogoutLink");
    var permLi = document.getElementById("sgcMenuPermissoes");
    if (data && typeof data.acessoSistemaOk !== "undefined") {
      window.__sgcAcessoSistemaOk = !!data.acessoSistemaOk;
    }
    if (data && typeof data.podeGerirPermissoes !== "undefined") {
      window.__sgcPodeGerirPermissoes = !!data.podeGerirPermissoes;
    }
    if (data && data.mensagemSemAcesso) {
      window.__sgcMensagemSemAcesso = String(data.mensagemSemAcesso);
    }
    if (permLi) {
      permLi.style.display = data && data.podeGerirPermissoes ? "" : "none";
    }
    if (!emailEl || !logoutEl) return;
    if (data && data.email) {
      emailEl.innerHTML =
        '<span class="header-session-label">Conta</span>: ' +
        String(data.email).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    } else {
      emailEl.innerHTML = '<span class="header-session-label">Conta</span>: não identificada';
    }
    var url = data && data.logoutUrl ? String(data.logoutUrl).trim() : "";
    if (url) {
      logoutEl.href = url;
      logoutEl.removeAttribute("aria-disabled");
    } else {
      logoutEl.href = "#";
      logoutEl.setAttribute("aria-disabled", "true");
    }
  };

  window.sgcViewAtual = "home";
  window.sgcViewIdAtual = "";

  var SGC_RESET_VIEW_HOOKS_ = {
    consulta: "SgcConsultaResetarAoEntrar",
    cadastro: "SgcCadastroResetarAoEntrar",
    "turma-editar": "SgcTurmaEditarResetarAoEntrar",
    "turma-excluir": "SgcTurmaExcluirResetarAoEntrar",
    "agendamento-incluir": "SgcAgendamentoIncluirResetarAoEntrar",
    "agendamento-consulta": "SgcAgendamentoConsultaResetarAoEntrar",
    "agendamento-editar": "SgcAgendamentoEditarResetarAoEntrar",
    "agendamento-excluir": "SgcAgendamentoExcluirResetarAoEntrar",
    "permissoes-incluir": "SgcPermissoesIncluirResetarAoEntrar",
    "permissoes-consultar": "SgcPermissoesConsultaResetarAoEntrar",
    "calendario-consultar": "SgcCalendarioConsultaResetarAoEntrar"
  };

  function sgcMenuViewEhMesmaTelaAtual_(view, id) {
    view = view || "home";
    id = (id && String(id).trim()) ? String(id).trim() : "";
    return window.sgcViewAtual === view && window.sgcViewIdAtual === id;
  }

  function sgcScrollTopoSuave_() {
    try {
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e0) {
      try {
        window.scrollTo(0, 0);
      } catch (e1) {}
    }
  }

  function sgcResetarViewAoReclicarMenu_(view) {
    if (view === "home") {
      mostrarHomeLocal_(MSG_BEMVINDO);
      return;
    }
    var hookName = SGC_RESET_VIEW_HOOKS_[view];
    if (hookName && typeof window[hookName] === "function") {
      window[hookName]();
    }
  }

  function sgcRegistrarViewAtual_(view, id) {
    window.sgcViewAtual = view || "home";
    window.sgcViewIdAtual = (id && String(id).trim()) ? String(id).trim() : "";
  }

  function navigate(view, id) {
    view = view || "home";
    id = (id && String(id).trim()) ? String(id).trim() : "";
    if (window.__sgcGateSessaoOk !== true && view !== "home") {
      return;
    }
    view = resolverViewPermitida_(view);
    if (sgcMenuViewEhMesmaTelaAtual_(view, id)) {
      closeMenuDropdowns();
      setMenuActive(view, id);
      if (typeof window.sgcRenderMensagemTopo === "function") {
        window.sgcRenderMensagemTopo("", "info");
      }
      sgcResetarViewAoReclicarMenu_(view);
      sgcScrollTopoSuave_();
      return;
    }
    if (typeof window.sgcRenderMensagemTopo === "function") {
      window.sgcRenderMensagemTopo("", "info");
    }
    if (view === "home") {
      mostrarHomeLocal_(MSG_BEMVINDO);
      sgcRegistrarViewAtual_("home", "");
    } else {
      mainContent.innerHTML = "<div class=\"main-placeholder\"></div>";
    }
    var MS_POR_TENTATIVA = 55000;
    var MAX_TENTATIVAS = 2;
    var endBusy = typeof window.appOcupadoIniciar === "function" ? window.appOcupadoIniciar({ blocking: false }) : null;
    var busySafetyTimer = null;
    var tentativaCarregar = 1;

    function limparTimerNavegacao() {
      if (busySafetyTimer) {
        clearTimeout(busySafetyTimer);
        busySafetyTimer = null;
      }
    }

    function encerrarOcupadoNavegacao() {
      limparTimerNavegacao();
      if (endBusy) {
        endBusy();
        endBusy = null;
      }
    }

    function falhaFinalNavegacao(mensagem) {
      encerrarOcupadoNavegacao();
      showError(mensagem);
    }

    function armarTimeoutPedido() {
      limparTimerNavegacao();
      busySafetyTimer = setTimeout(function() {
        busySafetyTimer = null;
        if (tentativaCarregar >= MAX_TENTATIVAS) {
          falhaFinalNavegacao(
            "A resposta do servidor não chegou ao browser a tempo (não está relacionado com o tamanho da planilha). " +
              "Já foi feita uma nova tentativa automática. Atualize a página (F5) ou tente outro browser/rede."
          );
          return;
        }
        tentativaCarregar++;
        pedirPagina();
      }, MS_POR_TENTATIVA);
    }

    function pedirPagina() {
      if (view === "home") {
        encerrarOcupadoNavegacao();
        return;
      }
      armarTimeoutPedido();
      google.script.run
        .withSuccessHandler(function(data) {
          limparTimerNavegacao();
          if (endBusy) {
            endBusy();
            endBusy = null;
          }
          try {
            if (!data || typeof data.html === "undefined") {
              mainContent.innerHTML = "<div class=\"main-placeholder\"></div>";
              return;
            }
            var html = data.html;
            if (typeof html !== "string" || !html.trim()) {
              showError("Resposta vazia do servidor.");
              return;
            }
            mainContent.innerHTML = html;
            if (data.script && data.script.trim()) runScript(data.script);
            if (view === "consulta" && typeof window.ConsultaInit === "function") {
              try { window.ConsultaInit(); } catch (err) { showError("Erro ao iniciar Consultar (turmas): " + (err && err.message ? err.message : String(err))); }
            } else if (view === "cadastro" && typeof window.CadastroInit === "function") {
              try { window.CadastroInit(); } catch (err) { showError("Erro ao iniciar Cadastro: " + (err && err.message ? err.message : String(err))); }
            } else if (view === "agendamento-incluir" && typeof window.AgendamentoIncluirInit === "function") {
              try { window.AgendamentoIncluirInit(); } catch (err) { showError("Erro ao iniciar Agendamento: " + (err && err.message ? err.message : String(err))); }
            } else if (view === "agendamento-consulta" && typeof window.AgendamentoConsultaInit === "function") {
              try { window.AgendamentoConsultaInit(); } catch (err) { showError("Erro ao iniciar Consultar (agendamentos): " + (err && err.message ? err.message : String(err))); }
            } else if (view === "agendamento-editar" && typeof window.AgendamentoEditarInit === "function") {
              try { window.AgendamentoEditarInit(); } catch (err) { showError("Erro ao iniciar Edição de agendamentos: " + (err && err.message ? err.message : String(err))); }
            } else if (view === "agendamento-excluir" && typeof window.AgendamentoExcluirInit === "function") {
              try { window.AgendamentoExcluirInit(); } catch (err) { showError("Erro ao iniciar Exclusão de agendamentos: " + (err && err.message ? err.message : String(err))); }
            } else if (view === "turma-excluir" && typeof window.TurmaExcluirInit === "function") {
              try { window.TurmaExcluirInit(); } catch (err) { showError("Erro ao iniciar Exclusão de turmas: " + (err && err.message ? err.message : String(err))); }
            } else if (view === "turma-editar" && typeof window.TurmaEditarInit === "function") {
              try { window.TurmaEditarInit(); } catch (err) { showError("Erro ao iniciar Edição de turmas: " + (err && err.message ? err.message : String(err))); }
            } else if (view === "permissoes-incluir" && typeof window.PermissoesIncluirInit === "function") {
              try { window.PermissoesIncluirInit(); } catch (err) { showError("Erro ao iniciar Incluir permissões: " + (err && err.message ? err.message : String(err))); }
            } else if (view === "permissoes-consultar" && typeof window.PermissoesConsultaInit === "function") {
              try { window.PermissoesConsultaInit(); } catch (err) { showError("Erro ao iniciar Consultar permissões: " + (err && err.message ? err.message : String(err))); }
            } else if (view === "calendario-consultar" && typeof window.CalendarioConsultaInit === "function") {
              try { window.CalendarioConsultaInit(); } catch (err) { showError("Erro ao iniciar Calendário: " + (err && err.message ? err.message : String(err))); }
            }
            sgcRegistrarViewAtual_(view, id);
          } catch (err) {
            showError("Erro ao aplicar conteúdo: " + (err && err.message ? err.message : String(err)));
          }
        })
        .withFailureHandler(function(err) {
          limparTimerNavegacao();
          var errStr = String(err);
          if (/Apenas administradores podem gerir permissões/i.test(errStr) && viewEhPermissoesAdmin_(view)) {
            if (endBusy) {
              endBusy();
              endBusy = null;
            }
            navigate("home", "");
            return;
          }
          if (
            typeof window.tratarErroInfraestruturaSpaSeAplicavel === "function" &&
            window.tratarErroInfraestruturaSpaSeAplicavel(errStr)
          ) {
            if (endBusy) {
              endBusy();
              endBusy = null;
            }
            return;
          }
          if (tentativaCarregar >= MAX_TENTATIVAS) {
            if (endBusy) {
              endBusy();
              endBusy = null;
            }
            showError("Erro ao carregar: " + errStr);
            return;
          }
          tentativaCarregar++;
          pedirPagina();
        })
        .getPageContent(view, id);
    }

    function iniciarNavegacaoOuVerificacao() {
      if (window.__sgcGateSessaoOk !== true) {
        encerrarOcupadoNavegacao();
        return;
      }
      if (window.__spaAcessoPlanilhaOk === false) {
        encerrarOcupadoNavegacao();
        showBloqueioCentral(
          window.__spaAcessoPlanilhaMsg ||
            "Esta aplicação não consegue aceder aos dados. Atualize a página (F5) após resolver o problema."
        );
        return;
      }
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.ok) {
            if (endBusy) {
              endBusy();
              endBusy = null;
            }
            var failMsg = mapearRespostaVerificacaoAcesso_(res);
            window.__spaAcessoPlanilhaOk = false;
            window.__spaAcessoPlanilhaMsg = failMsg;
            window.__sgcAcessoSistemaOk = false;
            definirMenuVisivelArranque_(false);
            sgcMostrarAvisoSemAcesso_(failMsg);
            showBloqueioCentral(failMsg);
            return;
          }
          window.__spaAcessoPlanilhaOk = true;
          window.__spaAcessoPlanilhaMsg = "";
          if (view === "home") {
            encerrarOcupadoNavegacao();
            return;
          }
          pedirPagina();
        })
        .withFailureHandler(function(err) {
          if (endBusy) {
            endBusy();
            endBusy = null;
          }
          var raw = String(err);
          var failMsg =
            typeof window.resolverMensagemErroInfraestruturaSpa === "function"
              ? window.resolverMensagemErroInfraestruturaSpa(raw)
              : null;
          failMsg = failMsg || raw || "Não foi possível validar o acesso à planilha.";
          window.__spaAcessoPlanilhaOk = false;
          window.__spaAcessoPlanilhaMsg = failMsg;
          window.__sgcAcessoSistemaOk = false;
          definirMenuVisivelArranque_(false);
          sgcMostrarAvisoSemAcesso_(failMsg);
          showBloqueioCentral(failMsg);
        })
        .verificarAcessoPlanilhaWebApp();
    }

    setMenuActive(view, id);
    iniciarNavegacaoOuVerificacao();
  }

  window.navigate = navigate;

  document.body.addEventListener("click", function(e) {
    var el = e.target.closest("[data-view]");
    if (el && el.getAttribute("data-view")) {
      if (window.__sgcGateSessaoOk !== true) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      e.preventDefault();
      e.stopPropagation();
      closeMenuDropdowns();
      navigate(el.getAttribute("data-view"), el.getAttribute("data-id") || "");
      return false;
    }
  }, true);

  document.body.addEventListener("keydown", function(e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var el = e.target.closest("[data-view]");
    if (el && el.getAttribute("data-view")) {
      if (window.__sgcGateSessaoOk !== true) {
        e.preventDefault();
        return;
      }
      e.preventDefault();
      closeMenuDropdowns();
      navigate(el.getAttribute("data-view"), el.getAttribute("data-id") || "");
    }
  }, true);

  function sgcGateFalha_(mensagem) {
    var msg =
      mensagem ||
      "Não foi possível validar a sessão. Tente novamente mais tarde.";
    window.__sgcGateSessaoOk = false;
    window.__spaAcessoPlanilhaOk = false;
    window.__spaAcessoPlanilhaMsg = msg;
    definirMenuVisivelArranque_(false);
    sgcMostrarAvisoSemAcesso_(msg);
    showBloqueioCentral(msg);
  }

  function sgcGatePronto_(data) {
    if (!data || data.acessoSistemaOk !== true) {
      var msgSem =
        (data && data.mensagemSemAcesso) ||
        window.__sgcMensagemSemAcesso ||
        "Acesso negado.";
      window.__sgcGateSessaoOk = false;
      window.__spaAcessoPlanilhaOk = false;
      window.__spaAcessoPlanilhaMsg = msgSem;
      definirMenuVisivelArranque_(false);
      sgcMostrarAvisoSemAcesso_(msgSem);
      showBloqueioCentral(msgSem);
      return;
    }
    if (typeof window.sgcAplicarIdentidadeCabecalho === "function") {
      window.sgcAplicarIdentidadeCabecalho(data);
    }
    window.__sgcGateSessaoOk = true;
    window.__spaAcessoPlanilhaOk = null;
    window.__spaAcessoPlanilhaMsg = "";
    sgcMostrarAvisoSemAcesso_("");
    var initialView = document.body.getAttribute("data-initial-view") || "home";
    var initialId = document.body.getAttribute("data-initial-id") || "";
    initialView = resolverViewPermitida_(initialView);
    /* Como no Apoio: boas-vindas na área central antes de revelar o menu. */
    if (initialView === "home") {
      mostrarHomeLocal_(MSG_BEMVINDO);
    }
    definirMenuVisivelArranque_(true);
    navigate(initialView, initialId);
  }

  function sgcIniciarGateArranque_() {
    window.__sgcGateSessaoOk = null;
    window.__spaAcessoPlanilhaOk = null;
    definirMenuVisivelArranque_(false);
    mainContent.innerHTML =
      '<div class="main-placeholder sgc-home-placeholder">' +
      '<p class="sgc-home-mensagem" id="sgcHomeMensagemPrincipal">Validando a sessão…</p></div>';
    if (typeof google === "undefined" || !google.script || typeof google.script.run !== "object") {
      sgcGateFalha_("Não foi possível contactar o servidor. Abra esta página pelo link publicado do Web App.");
      return;
    }
    google.script.run
      .withSuccessHandler(function(rGate) {
        if (!rGate || rGate.ok !== true) {
          sgcGateFalha_(
            (rGate && rGate.message) ||
              "Não foi possível identificar o seu utilizador. Aceda já autenticado com a conta do domínio."
          );
          return;
        }
        google.script.run
          .withSuccessHandler(function(data) {
            sgcGatePronto_(data);
          })
          .withFailureHandler(function() {
            sgcGateFalha_("Não foi possível validar a sessão. Tente novamente mais tarde.");
          })
          .obterIdentidadeCabecalhoWebApp();
      })
      .withFailureHandler(function() {
        sgcGateFalha_("Não foi possível validar a sessão. Tente novamente mais tarde.");
      })
      .obterEstadoGateSessaoExecucaoWebApp();
  }

  sgcIniciarGateArranque_();
})();
    </script>
  </body>
</html>
